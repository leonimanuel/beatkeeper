name: Release

# Publishes on a version tag. Cut one with:
#
#   npm version <patch|minor|major>
#   git push --follow-tags
#
# Requires an npm automation token in the NPM_TOKEN repository secret, or a
# trusted publisher configured for this repo on npmjs.com (in which case the
# NODE_AUTH_TOKEN line below can go).
#
# Running this from the Actions tab (workflow_dispatch) is ALWAYS a rehearsal:
# every publishing step is gated on the ref being a tag, so a manual run
# verifies, builds and packs, then stops. That gate is deliberate -- a manual
# run happens on a branch, and publishing whatever a branch currently holds is
# the accident this workflow exists to prevent.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Re-runs the full suite on the exact tagged commit. CI having been green on
  # the PR is not the same as green on what is about to ship.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, which cannot be taken back after 72 hours.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      # Required for npm provenance: mints the OIDC token npm attests with.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Pack and show contents
        run: |
          npm run clean && npm run build
          npm pack --dry-run

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/CHANGELOG.md)." \
            --verify-tag
