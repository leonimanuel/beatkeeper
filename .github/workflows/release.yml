name: Release

# Publishes on a version tag. Cut one with:
#
#   npm version <patch|minor|major>
#   git push --follow-tags
#
# Auth: an NPM_TOKEN secret. Trusted publishing is configured but blocked by
# npm/cli#9969 for repos on GitHub's immutable OIDC subject format. See the
# Publish step for the detail and for how to switch back.
#
# Running this from the Actions tab (workflow_dispatch) is ALWAYS a rehearsal:
# every publishing step is gated on the ref being a tag, so a manual run
# verifies, builds and packs, then stops. That gate is deliberate -- a manual
# run happens on a branch, and publishing whatever a branch currently holds is
# the accident this workflow exists to prevent.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Re-runs the full suite on the exact tagged commit. CI having been green on
  # the PR is not the same as green on what is about to ship.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, which cannot be taken back after 72 hours.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # No `environment:` here, deliberately. Naming one changes the OIDC
    # subject claim from repo:OWNER/REPO:ref:refs/tags/vX to
    # repo:OWNER/REPO:environment:NAME. npm matches that claim against the
    # trusted publisher's optional environment field, so a job in an
    # environment the npm config does not name fails to authenticate. The
    # `npm` environment this job used to declare carried no protection rules,
    # so it bought nothing and cost the match.
    permissions:
      contents: write
      # Required for npm provenance: mints the OIDC token npm attests with.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # registry-url makes setup-node write an .npmrc binding the registry to
      # ${NODE_AUTH_TOKEN}, which is what the publish step below needs. It is
      # also why an empty NPM_TOKEN fails ENEEDAUTH rather than falling
      # through to OIDC: npm reads a credential that is configured but blank.
      # Harmless while a real token is present; the reason it was briefly
      # removed is in the Publish step.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x. Trusted publishing (OIDC, no token) needs
      # npm >= 11.5.1, and the version that ships with the runner will not do.
      - name: Use an npm that can do trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Pack and show contents
        run: |
          npm run clean && npm run build
          npm pack --dry-run

      # Prints the identity npm will be matching against, so a failure to
      # authenticate is diagnosable from the log instead of by re-tagging.
      # Only the decoded claims are printed -- never the token itself.
      - name: Show the OIDC subject npm will match
        continue-on-error: true
        run: |
          payload=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const t=JSON.parse(s).value.split('.')[1];
                const c=JSON.parse(Buffer.from(t,'base64url'));
                console.log(JSON.stringify({sub:c.sub,repository:c.repository,ref:c.ref,environment:c.environment},null,2));
              })")
          echo "$payload"
          case "$payload" in
            *"@"*) echo "NOTE: immutable subject format (repo created after 2026-07-15)." ;;
          esac

      # Publishes with an NPM_TOKEN secret, NOT with the trusted publisher.
      #
      # Trusted publishing is configured on npmjs.com and still cannot work
      # here. GitHub issues an immutable OIDC subject for repositories created
      # after 2026-07-15 -- beatkeeper was created 2026-09-08 -- of the form
      #
      #   repo:OWNER@OWNER_ID/REPO@REPO_ID:ref:refs/tags/vX.Y.Z
      #
      # rather than repo:OWNER/REPO:ref:... . The registry does not match that
      # format, so the token exchange fails and npm reports a generic
      # ENEEDAUTH rather than a trusted-publishing diagnostic. npm/cli#9969.
      # The format cannot be turned off for this repository.
      #
      # So the secret is needed again until that is fixed. When it is: delete
      # the secret, drop registry-url above and the env binding below, and
      # this returns to OIDC with no other change. The step above prints the
      # subject, so whether the format has changed is readable from any run.
      #
      # --provenance is honoured on the token path -- 0.1.0 is attested.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/CHANGELOG.md)." \
            --verify-tag
